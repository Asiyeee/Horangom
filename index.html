
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horangom AI Öğretmeni</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0"
  }
}
</script>
<style>
  :root {
    --horangom-dark: #2C1E16;
    --horangom-accent: #D97757;
    --horangom-bg: #F7F2ED;
    --horangom-paper: #FFFDFC;
  }

  body {
    font-family: 'Quicksand', sans-serif;
    background-color: var(--horangom-bg);
    background-image: 
      url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Ctext x='10' y='30' fill='%232C1E16' fill-opacity='0.03' font-family='serif' font-size='20'%3Eㅎ%3C/text%3E%3Ctext x='60' y='80' fill='%232C1E16' fill-opacity='0.03' font-family='serif' font-size='15'%3Eㄱ%3C/text%3E%3C/svg%3E");
  }

  /* Ayı Silüeti Maskotu (Dekoratif) */
  .bear-motif {
    position: fixed;
    bottom: -20px;
    right: -20px;
    width: 200px;
    height: 200px;
    opacity: 0.05;
    pointer-events: none;
    z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath fill='%232C1E16' d='M100 20c-30 0-50 20-50 50 0 15 5 25 15 35-10 10-15 25-15 45 0 25 20 45 50 45s50-20 50-45c0-20-5-35-15-45 10-10 15-20 15-35 0-30-20-50-50-50zm-20 40a10 10 0 1 1 20 0 10 10 0 0 1-20 0zm40 0a10 10 0 1 1 20 0 10 10 0 0 1-20 0z'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
  }

  ::-webkit-scrollbar {
    width: 5px;
  }
  ::-webkit-scrollbar-thumb {
    background: #D9775744;
    border-radius: 10px;
  }
</style>
</head>
<body class="text-[#2C1E16]">
    <div id="root"></div>
    <div class="bear-motif"></div>
</body>
</html>
